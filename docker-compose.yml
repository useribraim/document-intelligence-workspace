services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: diw
      POSTGRES_USER: diw
      POSTGRES_PASSWORD: diw_local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diw -d diw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
