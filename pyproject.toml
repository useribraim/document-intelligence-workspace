[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-workspace"
version = "0.1.0"
description = "Markdown-first document intelligence workspace with source-cited retrieval, structured outputs, evaluation, AI-run provenance, and human review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/useribraim/document-intelligence-workspace"
Demo = "https://document-intelligence-workspace-312779789755.europe-west1.run.app/"
Repository = "https://github.com/useribraim/document-intelligence-workspace"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff==0.16.0",
]
cloud = [
  "google-genai>=1.0,<3",
]
auth = [
  "PyJWT[crypto]>=2.8,<3",
]
mcp = [
  "mcp>=1.0,<2",
]

[project.scripts]
diw = "diw.cli:main"
diw-mcp = "diw.mcp_server:main"
diw-annotate = "diw.annotation_app:main"
diw-vertex-smoke = "diw.vertex_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diw = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/diw/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
