[project]
name = "document-intelligence-workspace"
version = "1.8.2"
description = "Markdown-first document intelligence workspace with source-cited retrieval, structured outputs, evaluation, AI-run provenance, and human review."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
cloud = [
  "google-genai>=1.0,<3",
]
auth = [
  "PyJWT[crypto]>=2.8,<3",
]
mcp = [
  "mcp>=1.0,<2",
]

[project.scripts]
diw = "diw.cli:main"
diw-mcp = "diw.mcp_server:main"
diw-annotate = "diw.annotation_app:main"
diw-vertex-smoke = "diw.vertex_smoke:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
