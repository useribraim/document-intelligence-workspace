name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,cloud,auth,mcp]"

      - name: Check formatting and lint
        run: ruff check src tests scripts

      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy_cloud_run.sh
          bash -n scripts/run_vertex_cloud_smoke.sh

      - name: Run tests
        run: pytest -q

      - name: Verify public evidence and corpus manifest
        run: |
          python scripts/verify_public_evidence.py
          python scripts/build_calibration_v2.py --check
          python -m diw.cli corpus-verify --allow-missing
          python scripts/verify_audit_corpus_boundary.py

      - name: Build package
        run: python -m build
