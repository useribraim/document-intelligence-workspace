name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,cloud,auth,mcp]"

      - name: Check formatting and lint
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Verify frozen audit corpus
        run: python -m diw.cli corpus-verify
